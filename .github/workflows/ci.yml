name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests del núcleo
        working-directory: PlagOutCore
        run: swift test

  app:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: El proyecto de Xcode está al día con project.yml
        run: |
          brew install xcodegen
          xcodegen generate
          git diff --exit-code -- PlagOut.xcodeproj
      - name: Compilar para el simulador
        run: |
          xcodebuild -project PlagOut.xcodeproj -scheme PlagOut \
            -destination 'generic/platform=iOS Simulator' build | tail -20
          test "${PIPESTATUS[0]}" -eq 0
