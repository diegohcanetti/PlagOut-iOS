# Proyecto de Xcode generado con XcodeGen: `xcodegen generate` crea PlagOut.xcodeproj.
name: PlagOut
options:
  bundleIdPrefix: ar.plagout
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es

packages:
  PlagOutCore:
    path: PlagOutCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Firma automática con el Apple ID gratis (Personal Team) de quien compila.
    CODE_SIGN_STYLE: Automatic

targets:
  PlagOut:
    type: application
    platform: iOS
    sources:
      - path: PlagOut
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: PlagOutCore
        product: PlagOutCore
      - package: PlagOutCore
        product: PlagOutAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.plagout.ios
        PRODUCT_NAME: Plag-Out
        INFOPLIST_FILE: PlagOut/Recursos/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
