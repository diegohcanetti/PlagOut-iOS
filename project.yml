# Proyecto de Xcode generado con XcodeGen: `xcodegen generate` crea PlagOut.xcodeproj.
name: PlagOut
options:
  bundleIdPrefix: ar.plagout
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es

packages:
  PlagOutCore:
    path: PlagOutCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Firma automática con el Apple ID gratis (Personal Team) de quien compila. En el simulador
    # alcanza con "Sign to Run Locally": sin firma, iOS no deja guardar la sesión en el llavero.
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

targets:
  PlagOut:
    type: application
    platform: iOS
    sources:
      - path: PlagOut
    configFiles:
      Debug: PlagOut/Recursos/Config.xcconfig
      Release: PlagOut/Recursos/Config.xcconfig
    dependencies:
      - package: PlagOutCore
        product: PlagOutCore
      - package: PlagOutCore
        product: PlagOutAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.plagout.ios
        PRODUCT_NAME: Plag-Out
        INFOPLIST_FILE: PlagOut/Recursos/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  # Recorridos de pantalla contra producción con la cuenta de demo. Se corren a mano (necesitan
  # PLAGOUT_DEMO_EMAIL/PASSWORD); el CI no los corre.
  PlagOutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlagOutUITests
    dependencies:
      - target: PlagOut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.plagout.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PlagOut

schemes:
  PlagOut:
    build:
      targets:
        PlagOut: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlagOutUITests
